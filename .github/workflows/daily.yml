name: Daily Reel

on:
  schedule:
    # Every hour. reels/schedule.py decides whether a video is due: 3 a day, published 12:00, 16:00 (comedy) and
    # 19:00 IST (katha), each made up to 3 hours early. From 04:00 IST the first run also does the day's trend research
    # (reels/trends.py). GitHub's cron can be late or skip runs; the next hourly run then fills the gap.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "auto / comedy / paheli / devotional (auto = what the slot posts; paheli or devotional starts a new series)"
        default: "auto"
      upload:
        description: "Upload to YouTube? (true/false). A manual upload fills the next free slot."
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Is a video due?
        id: due
        env:
          HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HAS_YT" != "true" ]; then
            echo "::notice title=Setup pending::YouTube secrets are not set yet, so scheduled runs make nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "trends=$(python3 -m reels.trends --due)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then DUE=$(python3 -m reels.schedule --force); else DUE=$(python3 -m reels.schedule); fi
          echo "due: $DUE"
          if [ "$DUE" = "none" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "slot=${DUE% *}" >> "$GITHUB_OUTPUT"
          echo "publish=${DUE#* }" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.due.outputs.go == 'true' || steps.due.outputs.trends == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.due.outputs.go == 'true' || steps.due.outputs.trends == 'yes'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Research today's trends
        if: steps.due.outputs.trends == 'yes'
        continue-on-error: true      # without research the comedy reels use the plain news headlines
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m reels.trends

      - name: Restore character sprite cache
        if: steps.due.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: out/reel_sprites
          key: sprites-${{ hashFiles('reels/characters.py', 'reels/canvas.py') }}

      - name: Make the reel
        if: steps.due.outputs.go == 'true'
        env:
          # Either one works. CLAUDE_CODE_OAUTH_TOKEN uses your Claude Pro/Max subscription (`claude setup-token`).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS="--type ${{ github.event.inputs.type || 'auto' }} --slot ${{ steps.due.outputs.slot }} --post-time ${{ steps.due.outputs.publish }}"
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          python -m reels.pipeline $ARGS

      - name: Keep the video for 7 days (download from the run page)
        if: always() && steps.due.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            out/reel.mp4
            out/script.json
            out/qa.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state
        if: success() && (steps.due.outputs.go == 'true' || steps.due.outputs.trends == 'yes')
        run: |
          git config user.name "nikhilpal-reels-bot"
          git config user.email "nikhilpal-reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u '+%F %H:%M') UTC"
          # if someone pushed meanwhile, replay on top of it; on a clash in state/ the bot's fresh state wins
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
