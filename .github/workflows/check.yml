name: Check

# On every push that touches the code or samples: render a preview of every sample part, so a broken change
# shows up here instead of in the next daily run. Nothing is uploaded to YouTube.
on:
  push:
    paths: ["reels/**", "samples/**", "fonts/**", "requirements.txt", ".github/workflows/check.yml"]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preview every sample part
        run: |
          mkdir -p previews
          for f in samples/*.json; do
            n=$(python -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); print(len(d.get('parts', [d])))" "$f")
            for p in $(seq 1 "$n"); do
              echo "::group::$f part $p"
              python -m reels.pipeline --script "$f" --part "$p" --preview
              cp out/preview.jpg "previews/$(basename "$f" .json)_part$p.jpg"
              echo "::endgroup::"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews/
          retention-days: 7
